[project]
name = "padelrep"
version = "0.1.0"
description = "Replicação da atribuição golpe -> jogador de Decorte et al. (CVPRW 2024) no padel"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "gdown"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
